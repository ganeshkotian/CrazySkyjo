const CARD_COUNTS = { "-2": 5, "-1": 10, "0": 15, "1": 10, "2": 10, "3": 10, "4": 10, "5": 10, "6": 10, "7": 10, "8": 10, "9": 10, "10": 10, "11": 10, "12": 10 };
const CARD_COLORS = {
  "-2": { bg: "#1565C0", text: "#1565C0" },
  "-1": { bg: "#1976D2", text: "#1976D2" },
  "0": { bg: "#42A5F5", text: "#42A5F5" },
  "1": { bg: "#2E7D32", text: "#2E7D32" },
  "2": { bg: "#388E3C", text: "#388E3C" },

  "joker": { bg: "#7B1FA2", text: "#7B1FA2" },
  "reveal": { bg: "#00838F", text: "#00838F" },
  "block": { bg: "#37474F", text: "#37474F" },
};

function createDeck(fastTrack = false, specialCount = 4) {
  const deck = [];
  for (const [val, count] of Object.entries(CARD_COUNTS))
    for (let i = 0; i < count; i++) deck.push(parseInt(val));
  if (fastTrack) {
    for (let i = 0; i < specialCount; i++) deck.push("joker");
    for (let i = 0; i < specialCount; i++) deck.push("reveal");
    for (let i = 0; i < specialCount; i++) deck.push("block");
  }
  return shuffle([...deck]);
}
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; }
  return arr;
}

/* ─── Seeded RNG for Daily Challenge ─── */
function seededRandom(seed) {
  let h = 0;
  for (let i = 0; i < seed.length; i++) {
    h = (Math.imul(31, h) + seed.charCodeAt(i)) | 0;
  }
  return function() {
    h = h ^ (h << 13);
    h = h ^ (h >> 17);
    h = h ^ (h << 5);
    return (h >>> 0) / 4294967296;
  };
}
function seededShuffle(arr, rng) {
  for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; }
  return arr;
}
function getTodaySeed() {
  const d = new Date();
  return `skyjo-${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function createSeededDeck(rng) {
  const deck = [];
  for (const [val, count] of Object.entries(CARD_COUNTS))
    for (let i = 0; i < count; i++) deck.push(parseInt(val));
  return seededShuffle([...deck], rng);
}
const DAILY_CITIES = [
  "Paris", "Tokyo", "New York", "London", "Sydney", "Berlin", "Rome",
  "Dubai", "Seoul", "Mumbai", "Barcelona", "Istanbul", "Bangkok", "Cairo",
  "Amsterdam", "Prague", "Vienna", "Singapore", "Buenos Aires", "Lisbon",
  "Marrakech", "Vancouver", "Cape Town", "Kyoto", "Rio de Janeiro",
  "Stockholm", "Dublin", "Athens", "Helsinki", "Oslo",
  "Mexico City", "Shanghai", "Reykjavik", "Havana", "Nairobi",
  "Zurich", "Montreal", "San Francisco", "Bali", "Florence",
  "Edinburgh", "Bruges", "Copenhagen", "Porto", "Dubrovnik",
  "Queenstown", "Petra", "Santorini", "Maldives", "Cusco"
];
function getDailyCity() {
  const d = new Date();
  const dayOfYear = Math.floor((d - new Date(d.getFullYear(), 0, 0)) / 86400000);
  return DAILY_CITIES[dayOfYear % DAILY_CITIES.length];
}
function getDailyDateLabel() {
  const d = new Date();
  return d.toLocaleDateString("en-US", { day: "numeric", month: "long" });
}
function initDailyChallenge() {
  const seed = getTodaySeed();
  const rng = seededRandom(seed);
  const deck = createSeededDeck(rng);
  const pGrid = [], aGrid = [];
  for (let i = 0; i < 9; i++) pGrid.push({ value: deck.pop(), faceUp: false, removed: false });
  for (let i = 0; i < 9; i++) aGrid.push({ value: deck.pop(), faceUp: false, removed: false });
  return { deck, playerGrid: pGrid, aiGrid: aGrid, discard: [deck.pop()], dailyRng: rng };
}
function getDailyTier(score) {
  if (score < 0) return { emoji: "🏆", label: "Perfect", color: "#A78BFA" };
  if (score < 10) return { emoji: "🥇", label: "Gold", color: "#FFB627" };
  if (score < 20) return { emoji: "🥈", label: "Silver", color: "#C0C0C0" };
  if (score < 30) return { emoji: "🥉", label: "Bronze", color: "#CD7F32" };
  return { emoji: "😤", label: "Try Again", color: "#EF4444" };
}
function getDailyStreak() {
  try {
    const data = JSON.parse(localStorage.getItem("skyjo_daily_streak") || "{}");
    return { streak: data.streak || 0, lastDate: data.lastDate || "" };
  } catch { return { streak: 0, lastDate: "" }; }
}
function updateDailyStreak(won) {
  try {
    const today = new Date().toISOString().slice(0, 10);
    const data = getDailyStreak();
    if (data.lastDate === today) return data.streak; /* already recorded today */
    if (!won) { localStorage.setItem("skyjo_daily_streak", JSON.stringify({ streak: 0, lastDate: today })); return 0; }
    const yesterday = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
    const newStreak = data.lastDate === yesterday ? data.streak + 1 : 1;
    localStorage.setItem("skyjo_daily_streak", JSON.stringify({ streak: newStreak, lastDate: today }));
    return newStreak;
  } catch { return 0; }
}

/* ─── Coin System ─── */
const COIN_KEY = "skyjo_coins";
const STARTING_COINS = 500;
const ENTRY_FEE = 50;
const WIN_REWARD = 100;
const NEGATIVE_BONUS = 50;
const FAST_ENTRY = 25;
const COLUMN_CLEAR_BONUS = 10;
const FAST_WIN_REWARD = 50;
const FAST_NEGATIVE_BONUS = 25;

function getCoins() {
  try {
    const val = localStorage.getItem(COIN_KEY);
    if (val === null) { localStorage.setItem(COIN_KEY, String(STARTING_COINS)); return STARTING_COINS; }
    return parseInt(val, 10) || 0;
  } catch { return STARTING_COINS; }
}
function setCoins(n) {
  try { localStorage.setItem(COIN_KEY, String(Math.max(0, n))); } catch {}
}
function addCoins(n) { const c = getCoins() + n; setCoins(c); return c; }

  .stars .star { font-size: 20px; }
</style>
</head>
<body>
<div class="app">
<button class="back-btn" id="backBtn">←</button>

  <div class="topbar">
    <div class="stat coins">Coins<b id="coins">0</b></div>
    <div class="stat">Spins<b id="spins">0</b></div>
    <div class="stat">Shields<b id="shields">0</b></div>
    <div class="stat">Gems<b id="gems">0</b></div>
  </div>

  <!-- SLOT -->
  <div class="card">
    <h2>Spin & Win</h2>
    <div id="raidsWonBadge" style="text-align:center;margin-bottom:8px;font-size:15px;font-weight:bold;color:#4cd964;">⚔️ Raids Won: <span id="raidsWonCount">0</span></div>
    <div class="reels">
      <div class="reel" id="r0">🪙</div>
      <div class="reel" id="r1">🪙</div>
      <div class="reel" id="r2">🪙</div>
    </div>
    <div class="bet-row">
      <span>Bet</span>
      <button data-bet="10">10</button>
      <button data-bet="50">50</button>
      <button data-bet="100">100</button>
      <button data-bet="250">250</button>
    </div>
    <button class="spin-btn" id="spinBtn">SPIN</button>
    <div class="msg" id="msg"></div>
    <div class="legend">
      <div>🪙🪙🪙 x5 bet</div>
      <div>💰💰💰 x10 bet</div>
      <div>🔨 = Raid</div>
      <div>🛡️ = Shield</div>
      <div>💎 = Gem</div>
      <div>🎟️ spin regen</div>
    </div>
  </div>

  <!-- PROFILE BADGE -->
  <div id="profileBadge" style="text-align:center;margin:0 0 8px;padding:10px 16px;background:linear-gradient(135deg,rgba(255,215,0,0.15),rgba(255,165,0,0.1));border-radius:16px;border:1px solid rgba(255,215,0,0.25);">
    <div style="font-size:28px;" id="profileIcon">👺</div>
    <div id="profileTitle" style="font-size:16px;font-weight:800;color:#ffd700;letter-spacing:1px;text-transform:uppercase;text-shadow:0 1px 6px rgba(255,215,0,0.4);">Goblin Slayer</div>
    <div id="profileLevel" style="font-size:11px;color:rgba(255,255,255,0.5);margin-top:2px;">Village 1 / 10</div>
  </div>

  <!-- VILLAGE -->
  <div class="card">
    <div class="village-header">
      <h2 id="villageTitle">Your Village</h2>
      <div class="village-progress" id="villageProgress">1 / 10</div>
    </div>
    <div id="villageStars" class="stars"></div>
    <div class="village" id="village"></div>
  </div>

  <!-- RAIDS -->
  <div class="card">
    <h2>Raid Villages</h2>
    <div id="raidsLeftBadge" style="text-align:center;margin-bottom:8px;font-size:14px;font-weight:bold;color:#FFB627;">⚔️ Raids Left: <span id="raidsLeftCount">10</span> / 10</div>
    <div class="raid-list" id="raids"></div>
    <div class="log" id="log"></div>
  </div>

  <!-- Play Crazy Mode -->
  <div style="text-align:center; margin:12px 0 4px;">
    <button id="playCrazyBtn" style="background:linear-gradient(135deg,#F59E0B,#D97706);border:none;border-radius:50px;padding:14px 40px;font-size:18px;font-weight:bold;font-family:'Lilita One',cursive;color:#fff;cursor:pointer;letter-spacing:2px;text-transform:uppercase;box-shadow:0 6px 24px rgba(245,158,11,0.4);">⚡ Play Crazy Mode</button>
  </div>

  <div class="footer">
    Prototype · virtual coins only, no real-money prizes ·
    <button class="reset" id="reset">reset save</button>
  </div>
</div>

<!-- Completion dialog (hidden by default) -->
<div class="overlay" id="completeOverlay" style="display:none">
  <div class="dialog">
    <div class="trophy">🏆</div>
    <h2 id="completeTitle">Village Complete!</h2>
    <p id="completeDesc">You conquered this land!</p>
    <div class="reward" id="completeReward">+500 🪙 bonus</div>
    <p id="completeNext">Next: ???</p>
    <button id="completeBtn">Next Village →</button>
  </div>
</div>

<script>
(() => {
  // ---------- CONFIG ----------
  const SYMBOLS = [
    { id: 'coin',   icon: '🪙', weight: 30 },
    { id: 'hammer', icon: '🔨', weight: 18 },
    { id: 'shield', icon: '🛡️', weight: 16 },
    { id: 'gem',    icon: '💎', weight: 8 },
    { id: 'bag',    icon: '💰', weight: 6 },
  ];
  const MAX_SPINS_BASE = 50;
  const SPIN_REGEN_MS = 5 * 60 * 1000;
  const GEMS_PER_SPIN = 5;
  const RAID_INTERVAL_MS = 90 * 1000;
  const RAID_CHANCE = 0.35;
  const MAX_BUILDING_LEVEL = 5;

  // Village themes — each is a "world" the player completes
  const VILLAGES = [
    { name: 'Goblin Hollow',  icon: '👺', bg: '#1b1d3a', title: 'Goblin Slayer',
      buildings: [
        { id: 'hut',    name: 'Hut',      icon: '🛖', base: 100 },
        { id: 'farm',   name: 'Farm',     icon: '🌾', base: 250 },
        { id: 'forge',  name: 'Forge',    icon: '⚒️', base: 500 },
        { id: 'vault',  name: 'Vault',    icon: '🏦', base: 1000 },
      ]},
    { name: 'Pixie Glen',     icon: '🧚', bg: '#1a2e1a', title: 'Forest Guardian',
      buildings: [
        { id: 'treehouse', name: 'Treehouse', icon: '🌳', base: 200 },
        { id: 'garden',    name: 'Garden',    icon: '🌸', base: 500 },
        { id: 'fountain',  name: 'Fountain',  icon: '⛲', base: 1000 },
        { id: 'shrine',    name: 'Shrine',    icon: '🏛️', base: 2000 },
      ]},
    { name: 'Dragon Keep',    icon: '🐉', bg: '#2a1a1a', title: 'Dragon Lord',
      buildings: [
        { id: 'tower',   name: 'Tower',    icon: '🗼', base: 400 },
        { id: 'armory',  name: 'Armory',   icon: '⚔️', base: 800 },
        { id: 'stable',  name: 'Stable',   icon: '🐴', base: 1600 },
        { id: 'throne',  name: 'Throne',   icon: '👑', base: 3200 },
      ]},
    { name: 'Frost Peak',     icon: '🧊', bg: '#1a2a3a', title: 'Frost King',
      buildings: [
        { id: 'igloo',   name: 'Igloo',    icon: '🏔️', base: 600 },
        { id: 'lodge',   name: 'Lodge',    icon: '🏡', base: 1200 },
        { id: 'mine',    name: 'Mine',     icon: '⛏️', base: 2400 },
        { id: 'palace',  name: 'Palace',   icon: '🏰', base: 5000 },
      ]},
    { name: 'Sunny Shore',    icon: '🏝️', bg: '#1a2535', title: 'Island Chief',
      buildings: [
        { id: 'cabana',  name: 'Cabana',   icon: '🏖️', base: 1000 },
        { id: 'dock',    name: 'Dock',     icon: '⚓', base: 2000 },
        { id: 'market',  name: 'Market',   icon: '🏪', base: 4000 },
        { id: 'lighthouse', name: 'Lighthouse', icon: '🗼', base: 8000 },
      ]},
    { name: 'Shadow Realm',   icon: '👻', bg: '#1a1a2a', title: 'Shadow Master',
      buildings: [
        { id: 'crypt',   name: 'Crypt',    icon: '⚰️', base: 1500 },
        { id: 'dungeon', name: 'Dungeon',  icon: '🕳️', base: 3000 },
        { id: 'altar',   name: 'Altar',    icon: '🕯️', base: 6000 },
        { id: 'portal',  name: 'Portal',   icon: '🌀', base: 12000 },
      ]},
    { name: 'Sky Kingdom',    icon: '☁️', bg: '#1a2040', title: 'Sky Emperor',
      buildings: [
        { id: 'cloud',   name: 'Cloud Nest',  icon: '☁️', base: 2000 },
        { id: 'rainbow', name: 'Rainbow Bridge', icon: '🌈', base: 4000 },
        { id: 'airship', name: 'Airship',     icon: '🎈', base: 8000 },
        { id: 'stardome', name: 'Star Dome',  icon: '⭐', base: 16000 },
      ]},
    { name: 'Lava Fortress',  icon: '🌋', bg: '#2a1515', title: 'Volcano Warlord',
      buildings: [
        { id: 'bunker',  name: 'Bunker',   icon: '🧱', base: 3000 },
        { id: 'furnace', name: 'Furnace',  icon: '🔥', base: 6000 },
        { id: 'cannon',  name: 'Cannon',   icon: '💣', base: 12000 },
        { id: 'fortress', name: 'Fortress', icon: '🏯', base: 24000 },
      ]},
    { name: 'Crystal Caves',  icon: '💎', bg: '#1a1a30', title: 'Crystal Sage',
      buildings: [
        { id: 'tunnel',  name: 'Tunnel',   icon: '🕳️', base: 5000 },
        { id: 'workshop', name: 'Workshop', icon: '🔧', base: 10000 },
        { id: 'lab',     name: 'Lab',      icon: '🧪', base: 20000 },
        { id: 'reactor', name: 'Reactor',  icon: '⚡', base: 40000 },
      ]},
    { name: 'Golden City',    icon: '🌟', bg: '#2a2510', title: 'Golden Legend',
      buildings: [
        { id: 'gate',    name: 'Golden Gate', icon: '🚪', base: 8000 },
        { id: 'temple',  name: 'Temple',      icon: '🛕', base: 16000 },
        { id: 'colosseum', name: 'Colosseum',  icon: '🏟️', base: 32000 },
        { id: 'wonder',  name: 'Wonder',      icon: '✨', base: 64000 },
      ]},
  ];

  const NPC_NAMES = [
    { name: 'Goblin Hollow', icon: '👺' },
    { name: 'Pixie Glen',    icon: '🧚' },
    { name: 'Dragon Keep',   icon: '🐉' },
    { name: 'Frost Peak',    icon: '🧊' },
    { name: 'Sunny Shore',   icon: '🏝️' },
  ];

  // ---------- STATE ----------
  const SAVE_KEY = 'coinRaidProto_v2';
  const defaultState = () => ({
    coins: 500,
    spins: 10,
    spinsUpdatedAt: Date.now(),
    shields: 0,
    gems: 0,
    bet: 10,
    villageIndex: 0,
    buildings: { 0: 0, 1: 0, 2: 0, 3: 0 },
    completedVillages: 0,
    raidsWon: 0,
    raidsLeft: 10,
    npcs: NPC_NAMES.map(n => ({ ...n, coins: 800 + Math.floor(Math.random() * 2400), shield: Math.floor(Math.random() * 2) })),
    lastRaidCheck: Date.now(),
  });

  let state = load();
  let spinning = false;

  function load() {
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (raw) {
        const s = { ...defaultState(), ...JSON.parse(raw) };
        // Migrate: ensure buildings is {0,1,2,3} format
        if (!s.buildings || typeof s.buildings[0] === 'undefined') {
          s.buildings = { 0: 0, 1: 0, 2: 0, 3: 0 };
        }
        return s;
      }
    } catch (e) {}
    return defaultState();
  }
  function save() {
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch (e) {}
  }

  function getMaxSpins() { return MAX_SPINS_BASE + state.completedVillages; }
  function currentVillage() { return VILLAGES[state.villageIndex % VILLAGES.length]; }
  function villageBuildings() { return currentVillage().buildings; }
  function completionBonus() { return 500 + state.completedVillages * 300; }

  // ---------- HELPERS ----------
  const $ = id => document.getElementById(id);
  const fmt = n => Math.floor(n).toLocaleString();
  const rand = () => Math.random();

  function showFloatingText(text, color, y, anchorEl) {
    const el = document.createElement('div');
    el.className = 'float-text';
    el.style.color = color || '#4cd964';
    if (anchorEl) {
      const rect = anchorEl.getBoundingClientRect();
      el.style.position = 'absolute';
      el.style.top = (rect.top + window.scrollY - 20) + 'px';
      el.style.left = (rect.left + rect.width / 2) + 'px';
      el.style.transform = 'translateX(-50%)';
    } else {
      el.style.top = (y || 200) + 'px';
    }
    el.textContent = text;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 1300);
  }

  function weightedSymbol() {
    const total = SYMBOLS.reduce((s, x) => s + x.weight, 0);
    let r = rand() * total;
    for (const s of SYMBOLS) {
      if ((r -= s.weight) < 0) return s;
    }
    return SYMBOLS[0];
  }
  const iconOf = id => SYMBOLS.find(s => s.id === id).icon;

  function setMsg(text, cls = 'neutral') {
    const el = $('msg');
    el.textContent = text;
    el.className = 'msg ' + cls;
  }

  function addLog(text) {
    const log = $('log');
    const d = document.createElement('div');
    d.textContent = \`\${new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}  \${text}\`;
    log.prepend(d);
    while (log.children.length > 40) log.removeChild(log.lastChild);
  }

  // ---------- SPIN REGEN ----------
  function regenSpins() {
    const now = Date.now();
    const maxSp = getMaxSpins();
    if (state.spins >= maxSp) {
      state.spinsUpdatedAt = now;
      return;
    }
    const elapsed = now - state.spinsUpdatedAt;
    const gained = Math.floor(elapsed / SPIN_REGEN_MS);
    if (gained > 0) {
      state.spins = Math.min(maxSp, state.spins + gained);
      state.spinsUpdatedAt += gained * SPIN_REGEN_MS;
      if (state.spins >= maxSp) state.spinsUpdatedAt = now;
    }
  }

  // ---------- VILLAGE ----------
  function upgradeCost(bIndex) {
    const b = villageBuildings()[bIndex];
    const lvl = state.buildings[bIndex] || 0;
    return Math.round(b.base * Math.pow(1.6, lvl));
  }

  function isVillageComplete() {
    return villageBuildings().every((_, i) => (state.buildings[i] || 0) >= MAX_BUILDING_LEVEL);
  }

  function buyUpgrade(bIndex) {
    const b = villageBuildings()[bIndex];
    const lvl = state.buildings[bIndex] || 0;
    if (lvl >= MAX_BUILDING_LEVEL) return;
    const cost = upgradeCost(bIndex);
    if (state.coins < cost) {
      setMsg(\`Need \${fmt(cost)} coins for \${b.name}\`, 'bad');
      return;
    }
    state.coins -= cost;
    state.buildings[bIndex] = lvl + 1;
    setMsg(\`\${b.name} upgraded to level \${lvl + 1}!\`, 'good');
    showFloatingText(\`\${b.icon} Lv \${lvl + 1}\`, '#ffc83d');
    addLog(\`Upgraded \${b.name} to level \${lvl + 1}\`);
    save();
    render();

    // Check completion
    if (isVillageComplete()) {
      setTimeout(() => showCompletionDialog(), 600);
    }
  }

  function showCompletionDialog() {
    const v = currentVillage();
    const bonus = completionBonus();
    const nextIdx = (state.villageIndex + 1) % VILLAGES.length;
    const nextV = VILLAGES[nextIdx];
    $('completeTitle').textContent = \`\${v.icon} \${v.name} Complete!\`;
    $('completeDesc').textContent = \`All buildings maxed! You conquered \${v.name}!\`;
    $('completeReward').textContent = \`+\${fmt(bonus)} 🪙 bonus · +1 Max Spin\`;
    $('completeNext').textContent = \`Next: \${nextV.icon} \${nextV.name}\`;
    $('completeOverlay').style.display = 'flex';
  }

  function advanceVillage() {
    const bonus = completionBonus();
    state.coins += bonus;
    state.completedVillages++;
    state.villageIndex = state.completedVillages % VILLAGES.length;
    state.buildings = { 0: 0, 1: 0, 2: 0, 3: 0 };
    $('completeOverlay').style.display = 'none';
    showFloatingText(\`+\${fmt(bonus)} 🪙\`, '#4cd964');
    addLog(\`Village complete! +\${fmt(bonus)} bonus coins\`);
    save();
    render();
  }

  function renderVillage() {
    const v = currentVillage();
    const blds = villageBuildings();
    $('villageTitle').textContent = \`\${v.icon} \${v.name}\`;
    $('villageProgress').textContent = \`Village \${state.completedVillages + 1} / \${VILLAGES.length}\`;

    // Profile badge — update icon, title, bg, and page theme per village
    $('profileIcon').textContent = v.icon;
    $('profileIcon').style.fontSize = '36px';
    $('profileTitle').textContent = v.title || v.name;
    $('profileLevel').textContent = \`Village \${state.completedVillages + 1} / \${VILLAGES.length} · \${state.raidsWon || 0} Raids Won\`;
    const badge = $('profileBadge');
    badge.style.background = \`linear-gradient(135deg, \${v.bg}cc, \${v.bg}88)\`;
    badge.style.borderColor = \`\${v.bg}ff\`;
    // Change page background per village
    document.documentElement.style.setProperty('--bg', v.bg);

    // Stars for completed villages
    const starsEl = $('villageStars');
    starsEl.innerHTML = '';
    for (let i = 0; i < VILLAGES.length; i++) {
      const s = document.createElement('span');
      s.className = 'star';
      s.textContent = i < state.completedVillages ? '⭐' : '☆';
      starsEl.appendChild(s);
    }

    const wrap = $('village');
    wrap.innerHTML = '';
    blds.forEach((b, i) => {
      const lvl = state.buildings[i] || 0;
      const maxed = lvl >= MAX_BUILDING_LEVEL;
      const cost = upgradeCost(i);
      const pct = (lvl / MAX_BUILDING_LEVEL) * 100;
      const card = document.createElement('div');
      card.className = 'building';
      card.innerHTML = \`
        <div class="icon">\${b.icon}</div>
        <div class="name">\${b.name}</div>
        <div class="lvl">Lv \${lvl} / \${MAX_BUILDING_LEVEL}</div>
        <div class="lvl-bar\${maxed ? ' maxed' : ''}"><div class="lvl-fill" style="width:\${pct}%"></div></div>
        \${maxed
          ? '<button class="done" disabled>✅ MAX</button>'
          : \`<button \${state.coins < cost ? 'disabled' : ''}>Upgrade · \${fmt(cost)}</button>\`
        }\`;
      if (!maxed) {
        card.querySelector('button').addEventListener('click', () => buyUpgrade(i));
      }
      wrap.appendChild(card);
    });
  }

  // ---------- RAIDS ----------
  function raidNpc(index, btnEl) {
    const npc = state.npcs[index];
    if (!npc || npc.coins <= 0) return;
    if ((state.raidsLeft || 0) < 1) {
      setMsg('No raids left! Win more in Crazy Mode.', 'bad');
      return;
    }
    state.raidsLeft--;
    performRaid(index, 1, btnEl);
    save();
    render();
  }

  function performRaid(npcIndex, strikes, btnEl) {
    const npc = state.npcs[npcIndex];
    let stolenTotal = 0;
    for (let i = 0; i < strikes; i++) {
      if (npc.coins <= 0) break;
      if (npc.shield > 0) {
        npc.shield--;
        addLog(\`\${npc.icon} \${npc.name} blocked your raid with a shield\`);
        continue;
      }
      const pct = 0.15 + rand() * 0.2;
      const stolen = Math.min(npc.coins, Math.max(20, Math.floor(npc.coins * pct)));
      npc.coins -= stolen;
      stolenTotal += stolen;
    }
    state.coins += stolenTotal;
    if (stolenTotal > 0) {
      state.raidsWon = (state.raidsWon || 0) + 1;
      setMsg(\`Raided \${npc.name}! +\${fmt(stolenTotal)} coins\`, 'good');
      addLog(\`Raided \${npc.name} for \${fmt(stolenTotal)} coins\`);
      showFloatingText('+' + fmt(stolenTotal) + ' 🪙', '#4cd964', null, btnEl);
    } else {
      showFloatingText('Blocked! 🛡️', '#ff5a6e', null, btnEl);
    }
    npc.coins = Math.min(npc.coins + 120, 4000);
  }

  function renderRaids() {
    const wrap = $('raids');
    wrap.innerHTML = '';
    state.npcs.forEach((npc, i) => {
      const row = document.createElement('div');
      row.className = 'raid-item';
      row.innerHTML = \`
        <div class="av">\${npc.icon}</div>
        <div class="info">
          <b>\${npc.name}</b>
          <small>\${fmt(npc.coins)} coins · \${npc.shield ? '🛡️ ' + npc.shield + ' shield' : 'no shield'}</small>
        </div>
        <button \${(state.raidsLeft || 0) < 1 ? 'disabled' : ''}>Raid</button>\`;
      const btn = row.querySelector('button');
      btn.addEventListener('click', () => raidNpc(i, btn));
      wrap.appendChild(row);
    });
  }

  function npcCounterRaids() {
    const now = Date.now();
    while (now - state.lastRaidCheck >= RAID_INTERVAL_MS) {
      state.lastRaidCheck += RAID_INTERVAL_MS;
      if (rand() < RAID_CHANCE) {
        const attacker = state.npcs[Math.floor(rand() * state.npcs.length)];
        if (state.shields > 0) {
          state.shields--;
          addLog(\`\${attacker.icon} \${attacker.name} tried to raid you — shield blocked it\`);
          setMsg(\`A shield blocked a raid from \${attacker.name}!\`, 'good');
        } else {
          const lost = Math.floor(state.coins * 0.08);
          state.coins -= lost;
          addLog(\`\${attacker.icon} \${attacker.name} raided you for \${fmt(lost)} coins\`);
          setMsg(\`\${attacker.name} raided you! -\${fmt(lost)} coins\`, 'bad');
        }
      }
    }
  }

  // ---------- SPIN ----------
  function evaluate(results) {
    const ids = results.map(r => r.id);
    const counts = Object.fromEntries(SYMBOLS.map(s => [s.id, 0]));
    ids.forEach(id => counts[id]++);

    let coinsWon = 0;
    let raidStrikes = counts.hammer;
    let shieldsGained = counts.shield;
    let gemsGained = counts.gem;
    const notes = [];

    if (ids[0] === ids[1] && ids[1] === ids[2]) {
      if (ids[0] === 'coin') { coinsWon += state.bet * 5; notes.push('Triple coins!'); }
      if (ids[0] === 'bag')  { coinsWon += state.bet * 10; notes.push('JACKPOT BAG!'); }
    } else if (counts.coin === 2) {
      coinsWon += state.bet;
      notes.push('Pair of coins');
    }

    coinsWon += counts.coin * Math.floor(state.bet / 2);

    return { coinsWon, raidStrikes, shieldsGained, gemsGained, notes };
  }

  function revealReels(finalIds) {
    return new Promise(resolve => {
      const reelEls = [0, 1, 2].map(i => $('r' + i));
      reelEls.forEach(el => el.classList.add('spinning'));
      const timers = reelEls.map((el, i) => {
        return setInterval(() => {
          el.textContent = weightedSymbol().icon;
        }, 70);
      });
      reelEls.forEach((el, i) => {
        setTimeout(() => {
          clearInterval(timers[i]);
          el.classList.remove('spinning');
          el.textContent = iconOf(finalIds[i]);
          if (i === 2) resolve();
        }, 900 + i * 450);
      });
    });
  }

  async function spin() {
    if (spinning) return;
    regenSpins();
    if (state.spins < 1) {
      setMsg('Out of spins. Gems convert to spins, or wait for regen.', 'bad');
      return;
    }
    if (state.coins < state.bet) {
      setMsg('Not enough coins for this bet — raid or upgrade later!', 'bad');
      return;
    }

    spinning = true;
    $('spinBtn').disabled = true;
    state.coins -= state.bet;
    state.spins--;
    setMsg('Spinning…');

    const results = [weightedSymbol(), weightedSymbol(), weightedSymbol()];
    await revealReels(results.map(r => r.id));

    const r = evaluate(results);
    state.coins += r.coinsWon;
    state.shields += r.shieldsGained;
    state.gems += r.gemsGained;

    const maxSp = getMaxSpins();
    while (state.gems >= GEMS_PER_SPIN) {
      state.gems -= GEMS_PER_SPIN;
      state.spins = Math.min(maxSp + 10, state.spins + 1);
      addLog('5 gems converted to 1 spin');
    }

    if (r.raidStrikes > 0) {
      const added = Math.min(r.raidStrikes, 10 - (state.raidsLeft || 0));
      state.raidsLeft = Math.min(10, (state.raidsLeft || 0) + r.raidStrikes);
      if (added > 0) addLog(\`+\${added} raid\${added > 1 ? 's' : ''} earned\`);
    }

    const parts = [];
    if (r.coinsWon) parts.push(\`+\${fmt(r.coinsWon)} coins\`);
    if (r.shieldsGained) parts.push(\`+\${r.shieldsGained} shield\`);
    if (r.gemsGained) parts.push(\`+\${r.gemsGained} gem\`);
    if (r.raidStrikes) parts.push(\`+\${r.raidStrikes} raid\${r.raidStrikes > 1 ? 's' : ''}\`);
    const headline = r.notes.join(' · ') || (parts.length ? 'Nice!' : 'No luck this time');
    const kind = r.coinsWon || r.raidStrikes ? 'good' : 'neutral';

    setMsg(\`\${headline}\${parts.length ? ' — ' + parts.join(', ') : ''}\`, kind);

    if (r.coinsWon) addLog(\`Spin paid \${fmt(r.coinsWon)} coins\`);
    if (r.shieldsGained) addLog(\`Gained \${r.shieldsGained} shield\`);

    const wins = results.every(x => x.id === results[0].id);
    if (wins) document.querySelectorAll('.reel').forEach(el => el.classList.add('win'));
    setTimeout(() => document.querySelectorAll('.reel').forEach(el => el.classList.remove('win')), 900);

    spinning = false;
    $('spinBtn').disabled = false;
    save();
    render();
  }

  // ---------- RENDER ----------
  function render() {
    regenSpins();
    const maxSp = getMaxSpins();
    $('coins').textContent = fmt(state.coins);
    $('spins').textContent = \`\${state.spins}/\${maxSp}\`;
    $('shields').textContent = state.shields;
    $('gems').textContent = \`\${state.gems}/\${GEMS_PER_SPIN}\`;
    $('raidsWonCount').textContent = state.raidsWon || 0;
    $('raidsLeftCount').textContent = state.raidsLeft || 0;
    document.querySelectorAll('.bet-row button').forEach(b => {
      b.classList.toggle('active', Number(b.dataset.bet) === state.bet);
      b.disabled = spinning;
    });
    $('spinBtn').textContent = \`SPIN · bet \${state.bet}\`;
    renderVillage();
    renderRaids();
  }

  // ---------- EVENTS ----------
  document.querySelectorAll('.bet-row button').forEach(b => {
    b.addEventListener('click', () => {
      if (spinning) return;
      state.bet = Number(b.dataset.bet);
      save();
      render();
    });
  });
  $('spinBtn').addEventListener('click', spin);
  $('completeBtn').addEventListener('click', advanceVillage);
  $('playCrazyBtn').addEventListener('click', () => {
    window.parent.postMessage({ type: 'coinraid_crazy' }, '*');
  });
  // DEBUG: tap coins to add 10k
  $('coins').parentElement.addEventListener('click', () => {
    state.coins += 10000;
    save();
    render();
    showFloatingText('+10,000 🪙', '#ffd700');
  });

  $('reset').addEventListener('click', () => {
    if (confirm('Reset all progress?')) {
      localStorage.removeItem(SAVE_KEY);
      state = defaultState();
      $('log').innerHTML = '';
      setMsg('Save reset');
      save();
      render();
    }
  });

  // Import spins from card games (set, not add)
  try {
    const earned = parseInt(localStorage.getItem('skyjo_spins')) || 0;
    if (earned > 0) {
      state.spins = earned;
      localStorage.setItem('skyjo_spins', '0');
      save();
    }
  } catch(e) {}

  // Listen for spins from parent (backup mechanism)
  window.addEventListener('message', function(e) {
    if (e.data && e.data.type === 'import_spins' && e.data.spins > 0) {
      state.spins = e.data.spins;
      localStorage.setItem('skyjo_spins', '0');
      save();
      render();
    }
  });

  // ---------- LOOP ----------
  function tick() {
    npcCounterRaids();
    regenSpins();
    render();
    save();
  }

  render();
  setInterval(tick, 1000);

  // Back button -> parent
  $('backBtn').addEventListener('click', () => {
    window.parent.postMessage({ type: 'coinraid_home' }, '*');
  });

})();

/* ─── Mini Game: Column Clear ─── */
const MINI_ENTRY = 30;
const MINI_GRID_ROWS = 3;
const MINI_GRID_COLS = 4;
const MINI_DRAW_TOTAL = 12;
const MINI_COL_REWARDS = { low: 15, mid: 30, high: 50 }; /* by column sum */
const MINI_CLEAR_ALL_BONUS = 40;
const MINI_LEFTOVER_BONUS = 8; /* per card left in draw pile */

function initMiniGame() {
  /* Build a winnable mini game:
     - Each column gets 2 matching cards + 1 different card
     - Draw pile is seeded with cards that complete columns (the matching values)
     - Plus some filler cards for variety */
  const allVals = [];
  for (let v = 0; v <= 12; v++) allVals.push(v);
  allVals.push(-1, -2);
  const picked = shuffle([...allVals]).slice(0, MINI_GRID_COLS); /* 4 unique values for columns */

  /* Grid: each column has 2 of its value + 1 random different value */
  const gridCols = [];
  const neededCards = []; /* cards the draw pile must have to let player clear columns */
  for (let c = 0; c < MINI_GRID_COLS; c++) {
    const val = picked[c];
    /* pick a random different value for the odd card */
    let oddVal;
    do { oddVal = allVals[Math.floor(Math.random() * allVals.length)]; } while (oddVal === val);
    /* 2 matching + 1 odd, shuffled within column */
    const colCards = shuffle([val, val, oddVal]);
    gridCols.push(colCards);
    neededCards.push(val); /* one more of this value completes the column */
  }

  /* Build grid row-major from columns */
  const grid = [];
  for (let r = 0; r < MINI_GRID_ROWS; r++) {
    for (let c = 0; c < MINI_GRID_COLS; c++) {
      grid.push({ value: gridCols[c][r], faceUp: true, cleared: false });
    }
  }

  /* Build draw pile: needed cards first (shuffled in), plus filler */
  const fillerPool = [];
  for (let v = -2; v <= 12; v++) fillerPool.push(v);
  const fillerCount = 15 - neededCards.length; /* total pile = 15 */
  const filler = [];
  for (let i = 0; i < fillerCount; i++) {
    filler.push(fillerPool[Math.floor(Math.random() * fillerPool.length)]);
  }
  const drawPile = shuffle([...neededCards, ...filler]);

  /* 2 open cards from the pile */
  const open = [drawPile.pop(), drawPile.pop()];

  return { miniGrid: grid, miniDraw: drawPile, miniOpen: open, miniPicked: null, miniPickedIdx: null, miniCleared: [], miniCoinsEarned: 0, miniMessage: "", miniRefillIdx: null, miniRefillVal: null };
}

function miniColSum(grid, col) {
  let sum = 0, count = 0;
  for (let r = 0; r < MINI_GRID_ROWS; r++) {
    const cell = grid[r * MINI_GRID_COLS + col];
    if (!cell.cleared) { sum += cell.value; count++; }
  }
  return { sum, count };
}

function miniColReward(sum) {
  const abs = Math.abs(sum);
  if (abs <= 5) return MINI_COL_REWARDS.low;
  if (abs <= 15) return MINI_COL_REWARDS.mid;
  return MINI_COL_REWARDS.high;
}

function aiDecideMove(aiGrid) {
  const faceDownCards = aiGrid.map((c, i) => ({ ...c, idx: i })).filter(c => !c.faceUp && !c.removed);
  let worstFaceUp = null, worstFaceUpIdx = -1;
  for (let i = 0; i < aiGrid.length; i++) {
    if (aiGrid[i].faceUp && !aiGrid[i].removed && (worstFaceUp === null || aiGrid[i].value > worstFaceUp)) {
      worstFaceUp = aiGrid[i].value; worstFaceUpIdx = i;
    }
  }
  return { worstFaceUp, worstFaceUpIdx, faceDownCards };
}
function findColumnMatch(grid, value) {
  for (let col = 0; col < 3; col++) {
    const rows = [col, col + 3, col + 6];
    const vals = rows.map(i => grid[i]);
    const matching = vals.filter(c => c.faceUp && !c.removed && c.value === value);
    const available = vals.filter(c => !c.removed);
    if (matching.length === 2 && available.length === 3) {
      const target = rows.find(i => !grid[i].faceUp || (grid[i].faceUp && grid[i].value !== value));
      if (target !== undefined && !grid[target].removed) return target;
    }
  }
  return -1;
}
function aiTakeDiscard(aiGrid, discardTop) {
  const { worstFaceUp, worstFaceUpIdx, faceDownCards } = aiDecideMove(aiGrid);
  const colMatch = findColumnMatch(aiGrid, discardTop);
  if (colMatch !== -1) return { swapIdx: colMatch };
  if (discardTop <= 2 && worstFaceUp !== null && worstFaceUp > discardTop) return { swapIdx: worstFaceUpIdx };
  if (discardTop <= 4 && worstFaceUp !== null && worstFaceUp >= 9) return { swapIdx: worstFaceUpIdx };
  if (discardTop <= 3 && faceDownCards.length > 0) return { swapIdx: faceDownCards[0].idx };
  return null;
}
function aiUseDrawn(aiGrid, drawnCard) {
  const { worstFaceUp, worstFaceUpIdx, faceDownCards } = aiDecideMove(aiGrid);
  const colMatch = findColumnMatch(aiGrid, drawnCard);
  if (colMatch !== -1) return { action: "swap", swapIdx: colMatch };
  if (drawnCard <= 2) {
    if (worstFaceUp !== null && worstFaceUp > drawnCard) return { action: "swap", swapIdx: worstFaceUpIdx };
    if (faceDownCards.length > 0) return { action: "swap", swapIdx: faceDownCards[0].idx };
  }
  if (drawnCard <= 5 && worstFaceUp !== null && worstFaceUp >= 8) return { action: "swap", swapIdx: worstFaceUpIdx };
  if (faceDownCards.length > 0) return { action: "discard_flip", flipIdx: faceDownCards[Math.floor(Math.random() * faceDownCards.length)].idx };
  if (worstFaceUp !== null && drawnCard < worstFaceUp) return { action: "swap", swapIdx: worstFaceUpIdx };
  return { action: "discard_flip", flipIdx: -1 };
}
function cardValue(v) { return typeof v === "string" ? 0 : v; }
function calcScore(grid) { return grid.reduce((s, c) => s + (c.removed ? 0 : c.faceUp ? cardValue(c.value) : 0), 0); }
function calcFullScore(grid) { return grid.reduce((s, c) => s + (c.removed ? 0 : cardValue(c.value)), 0); }
function allFaceUp(grid) { return grid.every(c => c.faceUp || c.removed); }
function checkColumns(grid) {
  const removed = [];
  for (let col = 0; col < 3; col++) {
    const rows = [col, col + 3, col + 6];
    const active = rows.filter(i => !grid[i].removed);
    if (active.length === 3 && active.every(i => grid[i].faceUp)) {
      const vals = active.map(i => grid[i].value);
      const nonJokers = vals.filter(v => v !== "joker");
      /* Column clears if: all same value, or jokers fill in for a match */
      const match = nonJokers.length === 0 || nonJokers.every(v => v === nonJokers[0]);
      if (match) active.forEach(i => removed.push(i));
    }
  }
  return removed;
}

  HOME: "home", SETUP_FLIP: "setup_flip",
  PLAYER_TURN: "player_turn",
  PLAYER_DREW: "player_drew", PLAYER_TOOK_DISCARD: "player_took_discard",
  PLAYER_MUST_FLIP: "player_must_flip",
  AI_THINKING: "ai_thinking", ROUND_OVER: "round_over", GAME_OVER: "game_over",
  DAILY_PREVIEW: "daily_preview", DAILY_RESULT: "daily_result",
  MINI_HOME: "mini_home", MINI_PLAY: "mini_play", MINI_PICK: "mini_pick", MINI_PLACE: "mini_place", MINI_OVER: "mini_over",
  CITY: "city",
  SPIN: "spin",
  ATTACK: "attack",
  DEFEND: "defend",
};

function initRound(fastTrack = false, specialCount = 4) {
  const deck = createDeck(fastTrack, specialCount);
  const pGrid = [], aGrid = [];
  for (let i = 0; i < 9; i++) pGrid.push({ value: deck.pop(), faceUp: false, removed: false });
  for (let i = 0; i < 9; i++) aGrid.push({ value: deck.pop(), faceUp: false, removed: false });
  /* Ensure discard pile starts with a normal number card */
  let discardCard = deck.pop();
  while (typeof discardCard === "string") { deck.unshift(discardCard); discardCard = deck.pop(); }
  return { deck, playerGrid: pGrid, aiGrid: aGrid, discard: [discardCard] };
}

function SkyjoGame() {
  const [gs, setGs] = useState(() => {

  useEffect(() => {

  useEffect(() => {

  useEffect(() => {
    const hasNonFly = (anims) => Object.values(anims).some(a => typeof a === "string" && !a.startsWith("flyToDiscard"));
    if (hasNonFly(gs.playerAnims) || hasNonFly(gs.aiAnims)) {
      const t = setTimeout(() => setGs(p => {
        const cleanP = {}, cleanA = {};
        for (const [k, v] of Object.entries(p.playerAnims)) { if (v.startsWith("flyToDiscard")) cleanP[k] = v; }
        for (const [k, v] of Object.entries(p.aiAnims)) { if (v.startsWith("flyToDiscard")) cleanA[k] = v; }
        return { ...p, playerAnims: cleanP, aiAnims: cleanA };
      }), 600);
      return () => clearTimeout(t);
    }
  }, [gs.playerAnims, gs.aiAnims]);

  useEffect(() => {
    if (gs.pendingRemoval) {
      const t = setTimeout(() => {
        setGs(prev => {
          if (!prev.pendingRemoval) return prev;
          const { who, indices } = prev.pendingRemoval;
          const gridKey = who === "player" ? "playerGrid" : "aiGrid";
          const animKey = who === "player" ? "playerAnims" : "aiAnims";
          const newGrid = prev[gridKey].map(c => ({ ...c }));
          const newAnims = { ...prev[animKey] };
          indices.forEach(i => { newGrid[i] = { ...newGrid[i], removed: true }; delete newAnims[i]; });
          return { ...prev, [gridKey]: newGrid, [animKey]: newAnims, pendingRemoval: null };
        });
      }, 1300);
      return () => clearTimeout(t);
    }
  }, [gs.pendingRemoval]);

  // Auto setup flips — flip 2 for player, then 2 for AI, then start
  useEffect(() => {
    if (gs.phase !== PHASE.SETUP_FLIP) return;
    if (gs.setupFlips < 2) {
      const t = setTimeout(() => {
        setGs(prev => {
          if (prev.phase !== PHASE.SETUP_FLIP || prev.setupFlips >= 2) return prev;
          const ng = { ...prev, playerGrid: prev.playerGrid.map(c => ({ ...c })), playerAnims: {} };
          const fd = ng.playerGrid.map((c, i) => ({ ...c, i })).filter(c => !c.faceUp);
          const pick = fd[Math.floor(Math.random() * fd.length)];
          ng.playerGrid[pick.i] = { ...ng.playerGrid[pick.i], faceUp: true };
          ng.playerAnims[pick.i] = "flip";
          ng.setupFlips = prev.setupFlips + 1;
          ng.message = ng.setupFlips < 2 ? "Revealing cards..." : "AI revealing...";
          return ng;
        });
      }, 450);
      return () => clearTimeout(t);
    } else if (gs.aiSetupFlips < 2) {
      const t = setTimeout(() => {
        setGs(prev => {
          if (prev.phase !== PHASE.SETUP_FLIP || prev.aiSetupFlips >= 2) return prev;
          const ng = { ...prev, aiGrid: prev.aiGrid.map(c => ({ ...c })), aiAnims: {} };
          const fd = ng.aiGrid.map((c, i) => ({ ...c, i })).filter(c => !c.faceUp);
          const pick = fd[Math.floor(Math.random() * fd.length)];
          ng.aiGrid[pick.i] = { ...ng.aiGrid[pick.i], faceUp: true };
          ng.aiAnims[pick.i] = "flip";
          ng.aiSetupFlips = prev.aiSetupFlips + 1;
          if (ng.aiSetupFlips >= 2) {
            let firstPlayer;
            if (prev.lastRoundWinner) {
              firstPlayer = prev.lastRoundWinner;
            } else {
              const pVis = ng.playerGrid.filter(c => c.faceUp).reduce((s, c) => s + c.value, 0);
              const aVis = ng.aiGrid.filter(c => c.faceUp).reduce((s, c) => s + c.value, 0);
              firstPlayer = aVis > pVis ? "ai" : "player";
            }
            if (firstPlayer === "ai") { ng.phase = PHASE.AI_THINKING; ng.currentTurn = "ai"; ng.message = "AI goes first!"; }
            else { ng.phase = PHASE.PLAYER_TURN; ng.currentTurn = "player"; ng.message = "Your turn — draw or take discard"; }
          } else {
            ng.message = "AI revealing...";
          }
          return ng;
        });
      }, 450);
      return () => clearTimeout(t);
    }
  }, [gs.phase, gs.setupFlips, gs.aiSetupFlips]);

  useEffect(() => {
    if (gs.phase === PHASE.AI_THINKING) {
      const t = setTimeout(() => {
        setGs(prev => {
          const ng = { ...prev, aiGrid: prev.aiGrid.map(c => ({ ...c })), deck: [...prev.deck], discard: [...prev.discard], aiAnims: {}, aiSwapEject: null };

          /* If AI is blocked, just flip a face-down card and end turn */
          if (prev.aiBlocked) {
            ng.aiBlocked = false;
            const faceDown = ng.aiGrid.map((c, i) => ({ ...c, i })).filter(c => !c.faceUp && !c.removed);
            if (faceDown.length > 0) {
              const pick = faceDown[Math.floor(Math.random() * faceDown.length)];
              ng.aiGrid[pick.i] = { ...ng.aiGrid[pick.i], faceUp: true };
              ng.aiAnims[pick.i] = "flip";
              ng.message = "🚫 AI blocked — flipped a card";
            } else {
              ng.message = "🚫 AI blocked — no cards to flip";
            }
          } else {

          const discardTop = ng.discard[ng.discard.length - 1];
          /* AI skips special cards on discard pile */
          const dd = (typeof discardTop === "string") ? null : aiTakeDiscard(ng.aiGrid, discardTop);
          if (dd) {
            const old = ng.aiGrid[dd.swapIdx];
            const wasFaceUp = old.faceUp;
            ng.aiGrid[dd.swapIdx] = { value: discardTop, faceUp: true, removed: false };
            ng.discard[ng.discard.length - 1] = old.value;
            ng.aiAnims[dd.swapIdx] = "swapFromDiscardAI";
            ng.aiSwapEject = { oldValue: old.value, idx: dd.swapIdx, wasFaceUp };
            ng.pilePop = "discard";
            ng.message = "AI took " + discardTop + " from discard";
          } else {
            let drawn = ng.deck.pop();
            /* If AI draws a special card, discard it and flip a face-down card */
            if (typeof drawn === "string") {
              ng.discard.push(drawn);
              ng.pilePop = "receive";
              const fd = ng.aiGrid.map((c, i) => ({ ...c, i })).filter(c => !c.faceUp && !c.removed);
              if (fd.length > 0) {
                const pick = fd[Math.floor(Math.random() * fd.length)];
                ng.aiGrid[pick.i] = { ...ng.aiGrid[pick.i], faceUp: true };
                ng.aiAnims[pick.i] = "flip";
              }
              ng.message = "AI drew a special card and discarded it";
            } else {
            const dec = aiUseDrawn(ng.aiGrid, drawn);
            if (dec.action === "swap") {
              const old = ng.aiGrid[dec.swapIdx];
              const wasFaceUp = old.faceUp;
              ng.aiGrid[dec.swapIdx] = { value: drawn, faceUp: true, removed: false };
              ng.discard.push(old.value);
              ng.aiAnims[dec.swapIdx] = "swapFromDrawAI";
              ng.aiSwapEject = { oldValue: old.value, idx: dec.swapIdx, wasFaceUp };
              ng.pilePop = "draw";
              ng.message = "AI swapped in a " + drawn;
            } else {
              ng.discard.push(drawn);
              ng.pilePop = "receive";
              if (dec.flipIdx >= 0 && !ng.aiGrid[dec.flipIdx].faceUp) {
                ng.aiGrid[dec.flipIdx] = { ...ng.aiGrid[dec.flipIdx], faceUp: true };
                ng.aiAnims[dec.flipIdx] = "flip";
              }
              ng.message = "AI discarded " + drawn;
            }
            }
          }
          } /* end of non-blocked AI turn */
          const rem = checkColumns(ng.aiGrid);
          if (rem.length > 0) {
            const sorted = [...rem].sort((a, b) => b - a);
            sorted.forEach((idx, order) => { ng.aiAnims[idx] = "flyToDiscardAI" + order; });
            ng.pendingRemoval = { who: "ai", indices: rem };
            ng.message += " — Column cleared!";
          }
          if (allFaceUp(ng.aiGrid) && !ng.roundCloser) { ng.roundCloser = "ai"; ng.message += " — AI closes the round!"; }
          if (ng.roundCloser === "player" && ng.currentTurn === "ai") { ng.phase = PHASE.ROUND_OVER; ng.message = "Round over!"; ng.playerGrid = ng.playerGrid.map(c => ({ ...c, faceUp: true })); ng.aiGrid = ng.aiGrid.map(c => ({ ...c, faceUp: true })); }
          else { ng.phase = PHASE.PLAYER_TURN; ng.currentTurn = "player"; if (ng.roundCloser === "ai") ng.message += " Last turn!"; else ng.message += " — Your turn"; }
          return ng;
        });
      }, 1200);
      return () => clearTimeout(t);
    }
  }, [gs.phase]);

  /* Auto-advance from ROUND_OVER — shows cards briefly then moves on */
  useEffect(() => {
    if (gs.phase === PHASE.ROUND_OVER) {
      const t = setTimeout(() => handleNextRound(), 2000);
      return () => clearTimeout(t);
    }
  }, [gs.phase]);

  const finishPlayerTurn = (ng) => {
    ng.drawRevealed = false;
    const rem = checkColumns(ng.playerGrid);
    if (rem.length > 0) {
      const sorted = [...rem].sort((a, b) => b - a);
      sorted.forEach((idx, order) => {
        ng.playerAnims[idx] = "flyToDiscard" + order;
      });
      ng.pendingRemoval = { who: "player", indices: rem };
      const colCount = Math.floor(rem.length / 3);
      const bonus = COLUMN_CLEAR_BONUS * colCount;
      const newC = addCoins(bonus);
      ng.coins = newC;
      ng.coinsWon = (ng.coinsWon || 0) + bonus;
      ng.columnBonus = bonus;
      /* Award a shield on column clear (max 3) */
      if ((ng.shieldCount || 0) < 3) {
        ng.shieldCount = (ng.shieldCount || 0) + 1;
      }
      const clearedValue = ng.playerGrid[rem[0]].value;
      const victoryMsgs = clearedValue >= 8
        ? ["DESTROYED! 💥", "ELIMINATED! 🔥", "BYE BYE! 👋", "OBLITERATED! ⚡"]
        : clearedValue <= 2
          ? ["TRIPLE! ✨", "PERFECT! 🎯", "COLUMN CLEAR! 💎"]
          : ["CLEARED! 🌟", "BOOM! 💫", "NICE TRIPLE! ⭐", "SWEPT! 🧹"];
      ng.clearMessage = victoryMsgs[Math.floor(Math.random() * victoryMsgs.length)];
      ng.pilePop = "receive";
    }
    if (allFaceUp(ng.playerGrid) && !ng.roundCloser) { ng.roundCloser = "player"; ng.message = "You closed the round!"; ng.phase = PHASE.AI_THINKING; ng.currentTurn = "ai"; }
    else if (ng.roundCloser === "ai") { ng.phase = PHASE.ROUND_OVER; ng.message = "Round over!"; ng.playerGrid = ng.playerGrid.map(c => ({ ...c, faceUp: true })); ng.aiGrid = ng.aiGrid.map(c => ({ ...c, faceUp: true })); }
    else { ng.phase = PHASE.AI_THINKING; ng.currentTurn = "ai"; ng.message = (ng.message || "") + " AI thinking..."; }
    return ng;
  };

  /* ─── Play button from Home ─── */
  const handlePlay = () => {
    if (gs.coins < ENTRY_FEE) return; /* not enough coins — handled by UI */
    const newCoins = addCoins(-ENTRY_FEE);
    const s = initRound();
    setGs(prev => ({
      ...prev, ...s, phase: PHASE.SETUP_FLIP, setupFlips: 0, aiSetupFlips: 0,

      drawRevealed: false, pendingRemoval: null, swapEject: null, aiSwapEject: null,

      isDailyChallenge: false, isFastTrack: false, aiBlocked: false,
      coins: newCoins, coinsWon: 0,
    }));
  };

  const handleFastTrack = () => {
    if (gs.coins < FAST_ENTRY) return;
    const newCoins = addCoins(-FAST_ENTRY);
    const s = initRound(true, gs.specialCount || 4); /* Crazy Mode deck with special cards */
    setGs(prev => ({
      ...prev, ...s, phase: PHASE.SETUP_FLIP, setupFlips: 0, aiSetupFlips: 0,
      playerTotalScore: 0, aiTotalScore: 0, currentTurn: "player",

      message: "⚡ Crazy Mode — Revealing cards...", round: 1, playerAnims: {}, aiAnims: {},
      drawRevealed: false, pendingRemoval: null, swapEject: null, aiSwapEject: null,
      pilePop: null, clearMessage: null, columnBonus: null, lastRoundWinner: null,

      isFastTrack: true, aiBlocked: false,

  /* ─── Coin Raid Village ─── */
  const handleOpenCity = () => {
    // Re-write earned spins to localStorage right before iframe loads
    setGs(prev => {
      const sp = prev.spinTokens || 0;
      if (sp > 0) setSpins(sp);
      return { ...prev, phase: PHASE.CITY, showCoinDialog: false };

  };
  const handleCityHome = () => {
    setGs(prev => ({ ...prev, phase: PHASE.HOME, coins: getCoins() }));

  /* Listen for postMessage from Coin Raid iframe */
  useEffect(() => {
    const handler = (e) => {
      if (e.data && e.data.type === "coinraid_home") {
        setGs(prev => ({ ...prev, phase: PHASE.HOME, coins: getCoins(), slotShields: getShields(), slotGems: getGems() }));
      }
      if (e.data && e.data.type === "coinraid_crazy") {
        handleFastTrack();
      }
    };
    window.addEventListener("message", handler);
    return () => window.removeEventListener("message", handler);
  }, []);

  /* ─── Slot Machine (Coin Raid style) ─── */
  const SLOT_SYMBOLS = [
    { id: "coin",   icon: "🪙", weight: 30 },
    { id: "hammer", icon: "🔨", weight: 18 },
    { id: "shield", icon: "🛡️", weight: 16 },
    { id: "gem",    icon: "💎", weight: 8 },
    { id: "bag",    icon: "💰", weight: 6 },
  ];
  const SLOT_BETS = [10, 50, 100, 250];
  const GEMS_PER_SPIN = 5;
  const MAX_SPINS = 50;
  const SPIN_TOKEN_KEY = "skyjo_spins";
  const SHIELD_KEY = "skyjo_shields";
  const GEM_KEY = "skyjo_gems";

  const getSpins = () => { try { return parseInt(localStorage.getItem(SPIN_TOKEN_KEY)) || 0; } catch { return 0; } };
  const setSpins = (v) => { try { localStorage.setItem(SPIN_TOKEN_KEY, String(v)); } catch {} };
  const addSpins = (n) => { const v = Math.min(MAX_SPINS, Math.max(0, getSpins() + n)); setSpins(v); return v; };
  const getShields = () => { try { return parseInt(localStorage.getItem(SHIELD_KEY)) || 0; } catch { return 0; } };
  const setShieldsLS = (v) => { try { localStorage.setItem(SHIELD_KEY, String(v)); } catch {} };
  const getGems = () => { try { return parseInt(localStorage.getItem(GEM_KEY)) || 0; } catch { return 0; } };
  const setGemsLS = (v) => { try { localStorage.setItem(GEM_KEY, String(v)); } catch {} };

  const weightedSymbol = () => {
    const total = SLOT_SYMBOLS.reduce((s, x) => s + x.weight, 0);
    let r = Math.random() * total;
    for (const s of SLOT_SYMBOLS) { if ((r -= s.weight) < 0) return s; }
    return SLOT_SYMBOLS[0];
  };

  const evaluateSpin = (results, bet) => {
    const ids = results.map(r => r.id);
    const counts = {};
    SLOT_SYMBOLS.forEach(s => counts[s.id] = 0);
    ids.forEach(id => counts[id]++);
    let coinsWon = 0, raidStrikes = counts.hammer, shieldsGained = counts.shield, gemsGained = counts.gem;
    const notes = [];
    if (ids[0] === ids[1] && ids[1] === ids[2]) {
      if (ids[0] === "coin") { coinsWon += bet * 5; notes.push("Triple coins!"); }
      if (ids[0] === "bag") { coinsWon += bet * 10; notes.push("JACKPOT BAG!"); }
    } else if (counts.coin === 2) {
      coinsWon += bet; notes.push("Pair of coins");
    }
    coinsWon += counts.coin * Math.floor(bet / 2);
    return { coinsWon, raidStrikes, shieldsGained, gemsGained, notes };
  };

  const handleOpenSpin = () => {
    setGs(prev => ({
      ...prev, phase: PHASE.SPIN,
      spinTokens: getSpins(), slotBet: prev.slotBet || 10,
      slotReels: ["🪙", "🪙", "🪙"], slotSpinning: false, slotResult: null,
      slotShields: getShields(), slotGems: getGems(),
    }));
  };

  const handleSlotSpin = () => {
    if (gs.slotSpinning || gs.spinTokens < 1) return;
    const bet = gs.slotBet || 10;
    if (gs.coins < bet) return;
    const newCoins = addCoins(-bet);
    const newSpins = addSpins(-1);
    const results = [weightedSymbol(), weightedSymbol(), weightedSymbol()];
    // Start spinning animation
    setGs(prev => ({
      ...prev, coins: newCoins, spinTokens: newSpins,
      slotSpinning: true, slotResult: null,
      slotReelFinals: results,
      slotReelRevealed: [false, false, false],
    }));
    // Reveal reels one by one
    [0, 1, 2].forEach((i) => {
      setTimeout(() => {
        setGs(prev => {
          const revealed = [...prev.slotReelRevealed];
          revealed[i] = true;
          const reels = [...prev.slotReels];
          reels[i] = prev.slotReelFinals[i].icon;
          const allDone = revealed.every(Boolean);
          if (!allDone) return { ...prev, slotReels: reels, slotReelRevealed: revealed };
          // All revealed — evaluate
          const r = evaluateSpin(prev.slotReelFinals, prev.slotBet || 10);
          let fc = prev.coins;
          if (r.coinsWon > 0) fc = addCoins(r.coinsWon);
          let sh = (prev.slotShields || 0) + r.shieldsGained;
          setShieldsLS(sh);
          let gm = (prev.slotGems || 0) + r.gemsGained;
          // Auto-convert gems to spins
          let sp = prev.spinTokens;
          while (gm >= GEMS_PER_SPIN) { gm -= GEMS_PER_SPIN; sp = Math.min(MAX_SPINS, sp + 1); }
          setGemsLS(gm); setSpins(sp);
          // Raid strikes: auto-raid random NPC target
          let raidMsg = "";
          if (r.raidStrikes > 0) {
            const target = RANDOM_PLAYERS[Math.floor(Math.random() * RANDOM_PLAYERS.length)];
            const stolen = r.raidStrikes * (50 + Math.floor(Math.random() * 150));
            fc = addCoins(stolen);
            raidMsg = `⚔️ Raided ${target} for +${stolen} coins!`;
          }
          const parts = [];
          if (r.coinsWon) parts.push(`+${r.coinsWon} coins`);
          if (r.shieldsGained) parts.push(`+${r.shieldsGained} shield`);
          if (r.gemsGained) parts.push(`+${r.gemsGained} gem`);
          if (r.raidStrikes) parts.push(`${r.raidStrikes} raid`);
          const headline = r.notes.length ? r.notes.join(" · ") : (parts.length ? "Nice!" : "No luck");
          return {
            ...prev, slotReels: reels, slotReelRevealed: revealed,
            slotSpinning: false, coins: fc, spinTokens: sp,
            slotShields: sh, slotGems: gm,
            slotResult: { headline, parts, raidMsg, coinsWon: r.coinsWon, isWin: r.coinsWon > 0 || r.raidStrikes > 0 },
          };
        });
      }, 800 + i * 500);
    });
  };

  const handleSpinHome = () => {
    setGs(prev => ({ ...prev, phase: PHASE.HOME, coins: getCoins() }));
  };

  /* ─── Attack & Defend ─── */
  const ATTACK_BUILDINGS = [
    { id: "tower", emoji: "🏰", name: "Tower", reward: 3000 },
    { id: "market", emoji: "🏪", name: "Market", reward: 5000 },
    { id: "vault", emoji: "🏦", name: "Vault", reward: 8000 },
    { id: "palace", emoji: "👑", name: "Palace", reward: 12000 },
  ];

  const generateAttackMarks = () => {
    // All 4 buildings attackable, 1-2 are secretly shielded
    const shieldedCount = 1 + Math.floor(Math.random() * 2); // 1 or 2 shielded
    const shieldedIndices = [0, 1, 2, 3].sort(() => Math.random() - 0.5).slice(0, shieldedCount);
    return ATTACK_BUILDINGS.map((_, i) => ({
      buildingIdx: i,
      shielded: shieldedIndices.includes(i),
      revealed: false,
    }));
  };

  const RANDOM_PLAYERS = ["Luna", "Max", "Zara", "Kai", "Nova", "Finn", "Milo", "Aria", "Leo", "Ivy", "Rex", "Jade", "Axel", "Nora", "Hugo", "Cleo", "Omar", "Elsa", "Ravi", "Lina"];
  const handleStartAttack = () => {
    const marks = generateAttackMarks();
    const target = RANDOM_PLAYERS[Math.floor(Math.random() * RANDOM_PLAYERS.length)];
    setGs(prev => ({ ...prev, phase: PHASE.ATTACK, attackMarks: marks, attackHits: [], attackTarget: target }));
  };

  const handleAttackTap = (markIdx) => {
    if (gs.attackMarks[markIdx].revealed) return;
    const mark = gs.attackMarks[markIdx];
    const building = ATTACK_BUILDINGS[mark.buildingIdx];
    let newCoins = gs.coins;
    if (!mark.shielded) {
      newCoins = addCoins(building.reward);
    }
    const updatedMarks = gs.attackMarks.map((m, i) =>
      i === markIdx ? { ...m, revealed: true } : m
    );
    setGs(prev => ({
      ...prev,
      attackMarks: updatedMarks,
      attackHits: [...prev.attackHits, markIdx],
      coins: newCoins,
    }));
  };

  const handleAttackDone = () => {
    setGs(prev => ({ ...prev, phase: PHASE.HOME, coins: getCoins(), attackMarks: [], attackHits: [] }));
  };

  /* ─── Daily Challenge button from Home ─── */
  const handleDailyChallenge = () => {
    const dc = initDailyChallenge();
    const streak = getDailyStreak();
    setGs(prev => ({
      ...prev, ...dc, phase: PHASE.DAILY_PREVIEW,
      playerTotalScore: 0, aiTotalScore: 0, currentTurn: "player",
      drawnCard: null, heldCard: null, roundCloser: null,
      message: "",
      round: 1, playerAnims: {}, aiAnims: {},

  const handleStartDaily = () => {

  const handleMiniStart = () => {

      newOpen[refillSlot] = pile.pop();
    } else {
      newOpen[refillSlot] = null; /* no refill available */
    }

    /* Check if column is clearable: all same value */
    const col = gridIdx % MINI_GRID_COLS;
    let allSame = true, colVal = null, colActive = 0;
    for (let r = 0; r < MINI_GRID_ROWS; r++) {

      if (!cell.cleared) {

        else if (cell.value !== colVal) allSame = false;
      }

      earned = reward;

    /* Check game over: all columns cleared, or draw pile empty */
    const allCleared = cleared.length === MINI_GRID_COLS;
    const pileEmpty = pile.length === 0;

    if (allCleared || pileEmpty) {
      if (allCleared) {
        totalEarned += MINI_CLEAR_ALL_BONUS;
        totalEarned += pile.length * MINI_LEFTOVER_BONUS;

      setGs(prev => ({ ...prev, miniGrid: grid, miniDraw: pile, miniOpen: newOpen, miniPicked: null, miniPickedIdx: null, miniCleared: cleared, miniCoinsEarned: totalEarned, phase: PHASE.MINI_OVER, coins: finalCoins, miniMessage: allCleared ? "🎉 All columns cleared!" : "Draw pile empty!", miniRefillIdx: null, miniRefillVal: null }));

      }, 600);
    } else {

      {gs.phase === PHASE.HOME && (
        <div style={{
