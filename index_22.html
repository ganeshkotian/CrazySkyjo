                  }}>
                    <div style={{ fontSize: 40 }}>{bld.emoji}</div>
                    <div style={{ fontSize: 13, fontFamily: "'Lilita One', cursive", color: "#fff", marginTop: 4 }}>{bld.name}</div>
                    <div style={{ fontSize: 11, color: "rgba(255,255,255,0.5)" }}>🪙 {bld.reward.toLocaleString()}</div>
                    {/* X mark — visual indicator */}
                    {!isRevealed && (
                      <div style={{
                        position: "absolute", top: -8, right: -8,
                        width: 36, height: 36, borderRadius: "50%",
                        background: "linear-gradient(135deg, #EF4444, #B91C1C)",
                        border: "3px solid #FFD700",
                        display: "flex", alignItems: "center", justifyContent: "center",
                        fontSize: 18, color: "#fff", fontWeight: 900,
                        boxShadow: "0 2px 10px rgba(239,68,68,0.6)",
                        animation: "pulse 1s infinite",
                      }}>✕</div>
                    )}
                    {/* Reveal: raided! */}
                    {wasRaided && (
                      <div style={{
                        position: "absolute", top: "50%", left: "50%", transform: "translate(-50%, -50%)",
                        fontSize: 36, animation: "popIn 0.4s ease-out",
                      }}>💥</div>
                    )}
                    {/* Reveal: shielded! */}
                    {wasShielded && (
                      <div style={{
                        position: "absolute", top: "50%", left: "50%", transform: "translate(-50%, -50%)",
                        display: "flex", flexDirection: "column", alignItems: "center",
                        animation: "popIn 0.4s ease-out",
                      }}>
                        <span style={{ fontSize: 36 }}>🛡️</span>
                        <span style={{ fontSize: 10, color: "#93C5FD", fontFamily: "'Lilita One', cursive", marginTop: 2 }}>Protected!</span>
                      </div>
                    )}
                  </div>
                );
              })}
            </div>

            {/* Total stolen / Attack Failed */}
            {gs.attackHits.length > 0 && (() => {
              const lastHitIdx = gs.attackHits[gs.attackHits.length - 1];
              const lastMark = gs.attackMarks[lastHitIdx];
              const lastWasShielded = lastMark && lastMark.shielded;
              return (
                <div style={{
                  background: lastWasShielded ? "linear-gradient(135deg, #B91C1C, #EF4444)" : totalStolen > 0 ? "linear-gradient(135deg, #1B5E20, #2E7D32)" : "linear-gradient(135deg, #1E3A5F, #1565C0)",
                  borderRadius: 14, padding: "10px 24px", textAlign: "center",
                  boxShadow: "0 4px 16px rgba(0,0,0,0.3)",
                }}>
                  <div style={{ fontSize: 22, fontFamily: "'Lilita One', cursive", color: "#fff" }}>
                    {lastWasShielded ? "❌ Attack Failed!" : totalStolen > 0 ? `🪙 +${totalStolen.toLocaleString()} stolen!` : "🛡️ All blocked so far!"}
                  </div>
                  {totalStolen > 0 && lastWasShielded && (
                    <div style={{ fontSize: 13, color: "rgba(255,255,255,0.7)", marginTop: 4 }}>Total: +{totalStolen.toLocaleString()} 🪙</div>
                  )}
                </div>
              );
            })()}

            {/* Done + Replay buttons */}
            {allRevealed && (
              <div style={{ display: "flex", gap: 12 }}>
                <button onClick={handleFastTrack} disabled={gs.coins < FAST_ENTRY} style={{
                  background: gs.coins >= FAST_ENTRY ? "linear-gradient(135deg, #22C55E, #16A34A)" : "rgba(100,100,100,0.4)",
                  border: "none", borderRadius: 50, padding: "14px 36px",
                  fontSize: 18, fontFamily: "'Lilita One', cursive",
                  color: gs.coins >= FAST_ENTRY ? "#fff" : "#888",
                  cursor: gs.coins >= FAST_ENTRY ? "pointer" : "default",
                  letterSpacing: 1,
                  boxShadow: gs.coins >= FAST_ENTRY ? "0 6px 20px rgba(34,197,94,0.4)" : "none",
                  opacity: gs.coins >= FAST_ENTRY ? 1 : 0.5,
                }}>🔄 Replay</button>
                <button onClick={handleAttackDone} style={{
                  background: "linear-gradient(135deg, #455A64, #263238)",
                  border: "1px solid rgba(255,255,255,0.15)",
                  borderRadius: 50, padding: "14px 36px",
                  fontSize: 18, fontFamily: "'Lilita One', cursive", color: "#fff",
                  cursor: "pointer", letterSpacing: 1,
                }}>Done →</button>
              </div>
            )}

            <style>{`@keyframes popIn { 0% { transform: translate(-50%,-50%) scale(0); opacity: 0; } 50% { transform: translate(-50%,-50%) scale(1.3); } 100% { transform: translate(-50%,-50%) scale(1); opacity: 1; } }`}</style>
          </div>
        );
      })()}

      {/* Defend phase removed — lose flow goes to Build (CITY) */}

      {/* ═══ SLOT MACHINE ═══ */}
      {gs.phase === PHASE.SPIN && (
        <div style={{
          display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "flex-start",
          gap: 16, zIndex: 10, padding: 20, width: "100%", maxWidth: 420,
        }}>
          {/* Top bar */}
          <div style={{ width: "100%", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <button onClick={handleSpinHome} style={{
              background: "rgba(60,25,5,0.65)", border: "1px solid rgba(255,182,39,0.25)",
              borderRadius: 20, padding: "4px 12px", fontSize: 14, color: "#FFB627",
              cursor: "pointer", fontFamily: "'Arial Rounded MT Bold', sans-serif", fontWeight: 700,
            }}>← Home</button>
            <div style={{
              background: "rgba(60,25,5,0.65)", borderRadius: 20, padding: "4px 12px",
              fontSize: 13, color: "#FFB627", border: "1px solid rgba(255,182,39,0.25)",
              fontFamily: "'Arial Rounded MT Bold', sans-serif", fontWeight: 700,
            }}>🪙 {gs.coins.toLocaleString()}</div>
          </div>

          {/* Stats row */}
          <div style={{ display: "flex", gap: 8, width: "100%" }}>
            {[
              { label: "Spins", val: `${gs.spinTokens}/${MAX_SPINS}`, color: "#FFB627" },
              { label: "Shields", val: gs.slotShields || 0, color: "#3B82F6" },
              { label: "Gems", val: `${gs.slotGems || 0}/${GEMS_PER_SPIN}`, color: "#A855F7" },
            ].map(s => (
              <div key={s.label} style={{
                flex: 1, background: "rgba(0,0,0,0.4)", borderRadius: 14, padding: "8px 6px",
                textAlign: "center", border: "1px solid rgba(255,255,255,0.08)",
              }}>
                <div style={{ fontSize: 11, color: "rgba(255,255,255,0.5)", fontWeight: 600, letterSpacing: 0.5 }}>{s.label}</div>
                <div style={{ fontSize: 18, fontWeight: 800, color: s.color, fontFamily: "'Lilita One', cursive" }}>{s.val}</div>
              </div>
            ))}
          </div>

          {/* Title */}
          <div style={{
            fontSize: 26, fontFamily: "'Lilita One', cursive", color: "#FFD700",
            textShadow: "0 2px 8px rgba(0,0,0,0.5)", letterSpacing: 2,
          }}>🎰 SPIN & WIN</div>

          {/* 3 Reels */}
          <div style={{
            display: "flex", gap: 10, justifyContent: "center",
            background: "rgba(0,0,0,0.5)", borderRadius: 18, padding: 16,
            border: "2px solid rgba(255,215,0,0.2)",
          }}>
            {[0, 1, 2].map(i => (
              <div key={i} style={{
                width: 90, height: 90,
                background: "linear-gradient(180deg, #f7f7ff, #dcdcf5)",
                borderRadius: 14, display: "flex", alignItems: "center", justifyContent: "center",
                fontSize: 50, overflow: "hidden",
                boxShadow: "inset 0 -6px 0 rgba(0,0,0,0.15), 0 4px 12px rgba(0,0,0,0.3)",
                animation: gs.slotSpinning && !gs.slotReelRevealed[i] ? "blur 0.12s linear infinite" : undefined,
                outline: gs.slotResult && gs.slotResult.isWin && gs.slotReelRevealed[i] ? "3px solid #FFD700" : "none",
                transition: "outline 0.3s",
              }}>
                {gs.slotSpinning && !gs.slotReelRevealed[i]
                  ? SLOT_SYMBOLS[Math.floor(Math.random() * SLOT_SYMBOLS.length)].icon
                  : gs.slotReels[i]}
              </div>
            ))}
          </div>

          {/* Bet selector */}
          <div style={{ display: "flex", gap: 6, alignItems: "center" }}>
            <span style={{ fontSize: 13, color: "rgba(255,255,255,0.5)", fontWeight: 600 }}>Bet</span>
            {SLOT_BETS.map(b => (
              <button key={b} onClick={() => !gs.slotSpinning && setGs(prev => ({ ...prev, slotBet: b }))}
                style={{
                  background: (gs.slotBet || 10) === b ? "linear-gradient(135deg, #7C3AED, #5B21B6)" : "rgba(255,255,255,0.1)",
                  color: "#fff", border: "none", borderRadius: 10, padding: "8px 12px",
                  fontWeight: 700, cursor: gs.slotSpinning ? "default" : "pointer", fontSize: 14,
                  transition: "all 0.2s",
                }}>{b}</button>
            ))}
          </div>

          {/* Result display */}
          {gs.slotResult && !gs.slotSpinning && (
            <div style={{
              background: gs.slotResult.isWin ? "linear-gradient(135deg, #1B5E20, #2E7D32)" : "rgba(0,0,0,0.4)",
              borderRadius: 16, padding: "12px 24px", textAlign: "center",
              boxShadow: gs.slotResult.isWin ? "0 4px 16px rgba(34,197,94,0.3)" : "none",
              border: gs.slotResult.isWin ? "1px solid rgba(76,217,100,0.3)" : "1px solid rgba(255,255,255,0.1)",
              width: "100%",
            }}>
              <div style={{ fontSize: 20, fontFamily: "'Lilita One', cursive", color: gs.slotResult.isWin ? "#4CD964" : "#FFB627" }}>
                {gs.slotResult.headline}
              </div>
              {gs.slotResult.parts.length > 0 && (
                <div style={{ fontSize: 13, color: "rgba(255,255,255,0.7)", marginTop: 4 }}>
                  {gs.slotResult.parts.join(" · ")}
                </div>
              )}
              {gs.slotResult.raidMsg && (
                <div style={{ fontSize: 14, color: "#FF6B6B", marginTop: 4, fontWeight: 700 }}>
                  {gs.slotResult.raidMsg}
                </div>
              )}
            </div>
          )}

          {/* Spin button */}
          <button
            onClick={handleSlotSpin}
            disabled={gs.slotSpinning || gs.spinTokens < 1 || gs.coins < (gs.slotBet || 10)}
            style={{
              width: "100%",
              background: gs.slotSpinning ? "rgba(100,100,100,0.5)"
                : gs.spinTokens >= 1 && gs.coins >= (gs.slotBet || 10)
                  ? "linear-gradient(135deg, #ffd95a, #f5a623)"
                  : "rgba(100,100,100,0.4)",
              border: "none", borderRadius: 14, padding: "16px",
              fontSize: 20, fontWeight: 800, color: "#3a2400", letterSpacing: 1,
              cursor: gs.slotSpinning || gs.spinTokens < 1 ? "default" : "pointer",
              boxShadow: gs.spinTokens >= 1 && !gs.slotSpinning ? "0 5px 0 #b87410" : "none",
              opacity: gs.slotSpinning || gs.spinTokens < 1 ? 0.5 : 1,
              transition: "all 0.2s",
            }}
          >
            {gs.slotSpinning ? "Spinning..." : gs.spinTokens < 1 ? "No Spins Left" : `SPIN · bet ${gs.slotBet || 10}`}
          </button>

          {/* Out of spins — show options */}
          {gs.spinTokens < 1 && !gs.slotSpinning && (
            <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 10, width: "100%" }}>
              <div style={{ fontSize: 14, color: "#EF4444", fontFamily: "'Lilita One', cursive" }}>Out of spins!</div>
              <div style={{ display: "flex", gap: 10 }}>
                <button onClick={() => { const c = addCoins(0); const sp = addSpins(3); setGs(prev => ({ ...prev, coins: c, spinTokens: sp })); }} style={{
                  background: "linear-gradient(135deg, #22C55E, #16A34A)",
                  border: "none", borderRadius: 50, padding: "12px 24px",
                  fontSize: 16, fontFamily: "'Lilita One', cursive", color: "#fff",
                  cursor: "pointer", boxShadow: "0 4px 16px rgba(34,197,94,0.3)",
                }}>📺 Watch Ad (+3)</button>
                <button onClick={() => { handleSpinHome(); setTimeout(() => handleFastTrack(), 100); }} disabled={gs.coins < FAST_ENTRY} style={{
                  background: gs.coins >= FAST_ENTRY ? "linear-gradient(135deg, #F59E0B, #D97706)" : "rgba(100,100,100,0.4)",
                  border: "none", borderRadius: 50, padding: "12px 24px",
                  fontSize: 16, fontFamily: "'Lilita One', cursive",
                  color: gs.coins >= FAST_ENTRY ? "#fff" : "#888",
                  cursor: gs.coins >= FAST_ENTRY ? "pointer" : "default",
                  opacity: gs.coins >= FAST_ENTRY ? 1 : 0.5,
                }}>⚡ Play Crazy Mode</button>
              </div>
            </div>
          )}

          {/* Legend */}
          <div style={{
            display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 6, width: "100%",
            fontSize: 11, color: "rgba(255,255,255,0.5)",
          }}>
            {[
              "🪙🪙🪙 x5 bet", "💰💰💰 x10 bet", "🔨 = Raid",
              "🛡️ = Shield", "💎 = Gem", "5💎 = 1 spin",
            ].map((t, i) => (
              <div key={i} style={{
                background: "rgba(255,255,255,0.05)", borderRadius: 10, padding: 6, textAlign: "center",
              }}>{t}</div>
            ))}
          </div>
        </div>
      )}

      {/* ═══ MINI GAME: COLUMN CLEAR ═══ */}
      {[PHASE.MINI_PLAY, PHASE.MINI_PICK, PHASE.MINI_PLACE, PHASE.MINI_OVER].includes(gs.phase) && (
        <div style={{
          display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center",
          gap: 16, zIndex: 10, padding: 20, width: "100%", maxWidth: 400,
        }}>
          {/* Header */}
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", width: "100%", gap: 10 }}>
            <button onClick={handleMiniHome} style={{
              background: "rgba(60,25,5,0.65)", border: "1px solid rgba(255,182,39,0.25)",
              borderRadius: 20, padding: "4px 12px", fontSize: 14, color: "#FFB627",
              cursor: "pointer", fontFamily: "'Arial Rounded MT Bold', sans-serif", fontWeight: 700,
            }}>← Home</button>
            <div style={{ background: "rgba(124,58,237,0.65)", borderRadius: 20, padding: "4px 16px", fontSize: 13, color: "#E9D5FF", letterSpacing: 1, border: "1px solid rgba(167,139,250,0.4)", fontFamily: "'Lilita One', cursive" }}>🎯 COLUMN CLEAR</div>
            <div style={{ background: "rgba(60,25,5,0.65)", borderRadius: 20, padding: "4px 12px", fontSize: 13, color: "#FFB627", border: "1px solid rgba(255,182,39,0.25)", fontWeight: 700 }}>🪙 {gs.coins}</div>
          </div>

          {/* Draw pile count + earned info */}
          <div style={{ display: "flex", gap: 16, alignItems: "center" }}>
            <span style={{ fontSize: 13, color: "rgba(255,255,255,0.6)", fontFamily: "'Arial Rounded MT Bold', sans-serif" }}>Draw: {gs.miniDraw ? gs.miniDraw.length : 0} left</span>
            <span style={{ fontSize: 13, color: "#22C55E", fontFamily: "'Arial Rounded MT Bold', sans-serif" }}>Earned: +{gs.miniCoinsEarned} 🪙</span>
          </div>

          {/* Message */}
          {gs.miniMessage && (
            <div style={{
              background: gs.miniMessage.includes("cleared") ? "rgba(34,197,94,0.2)" : "rgba(0,0,0,0.4)",
              borderRadius: 12, padding: "8px 20px", fontSize: 14, color: gs.miniMessage.includes("cleared") ? "#22C55E" : "#FFB627",
              fontFamily: "'Lilita One', cursive", letterSpacing: 1, textAlign: "center",
              border: gs.miniMessage.includes("cleared") ? "1px solid rgba(34,197,94,0.3)" : "1px solid rgba(255,182,39,0.2)",
            }}>{gs.miniMessage}</div>
          )}

          {/* Grid 3×4 */}
          <div style={{
            background: "rgba(0,0,0,0.45)", borderRadius: 18, padding: 16,
            backdropFilter: "blur(12px)", border: "1px solid rgba(255,255,255,0.1)",
          }}>
            <div style={{ display: "grid", gridTemplateColumns: `repeat(${MINI_GRID_COLS}, 1fr)`, gap: 8 }}>
              {gs.miniGrid.map((card, i) => {
                const col = i % MINI_GRID_COLS;
                const isColCleared = gs.miniCleared.includes(col);
                const canPlace = gs.phase === PHASE.MINI_PLACE && !card.cleared;
                return (
                  <div key={i} onClick={canPlace ? () => handleMiniPlace(i) : null} style={{
                    width: 72, height: 100, borderRadius: 12,
                    background: card.cleared ? "rgba(34,197,94,0.15)" : (CARD_COLORS[String(card.value)] || { bg: "#888" }).bg,
                    border: canPlace ? "3px solid #FFB627" : card.cleared ? "2px dashed rgba(34,197,94,0.4)" : "2px solid rgba(255,255,255,0.15)",
                    display: "flex", alignItems: "center", justifyContent: "center",
                    fontSize: card.cleared ? 28 : 26, fontWeight: 900, color: card.cleared ? "rgba(34,197,94,0.5)" : "#fff",
                    fontFamily: "'Arial Rounded MT Bold', sans-serif",
                    cursor: canPlace ? "pointer" : "default",
                    boxShadow: canPlace ? "0 0 12px rgba(255,182,39,0.5)" : card.cleared ? "none" : "0 3px 10px rgba(0,0,0,0.3)",
                    transition: "all 0.3s",
                    animation: canPlace ? "pulseGlow 2s ease-in-out infinite" : undefined,
                    textShadow: card.cleared ? "none" : "0 2px 6px rgba(0,0,0,0.5)",
                  }}>
                    {card.cleared ? "✓" : card.value}
                  </div>
                );
              })}
            </div>
            {/* Column labels */}
            <div style={{ display: "grid", gridTemplateColumns: `repeat(${MINI_GRID_COLS}, 1fr)`, gap: 8, marginTop: 6 }}>
              {[0, 1, 2, 3].map(col => {
                const info = miniColSum(gs.miniGrid, col);
                const isCleared = gs.miniCleared.includes(col);
                return (
                  <div key={col} style={{ textAlign: "center", fontSize: 11, color: isCleared ? "#22C55E" : "rgba(255,255,255,0.5)", fontFamily: "'Arial Rounded MT Bold', sans-serif", fontWeight: 700 }}>
                    {isCleared ? `✓ +${miniColReward(info.sum)}🪙` : `Σ ${info.sum}`}
                  </div>
                );
              })}
            </div>
          </div>

          {/* Draw area — always visible */}
          {gs.phase !== PHASE.MINI_OVER && (
            <div style={{ display: "flex", alignItems: "center", gap: 16, position: "relative" }}>
              {/* Draw pile — closed card, clickable during MINI_PICK to skip */}
              <div onClick={gs.phase === PHASE.MINI_PICK && gs.miniDraw.length >= 2 ? handleMiniSkip : null} style={{
                width: 72, height: 100, borderRadius: 12,
                background: gs.miniDraw.length > 0 ? "#1565C0" : "rgba(255,255,255,0.05)",
                border: gs.phase === PHASE.MINI_PICK && gs.miniDraw.length >= 2 ? "2px solid #FFB627" : gs.miniDraw.length > 0 ? "2px solid #1976D2" : "2px dashed rgba(255,255,255,0.15)",
                display: "flex", alignItems: "center", justifyContent: "center",
                position: "relative", overflow: "hidden",
                boxShadow: gs.phase === PHASE.MINI_PICK && gs.miniDraw.length >= 2 ? "0 0 12px rgba(255,182,39,0.5)" : gs.miniDraw.length > 0 ? "0 3px 10px rgba(0,0,0,0.3)" : "none",
                cursor: gs.phase === PHASE.MINI_PICK && gs.miniDraw.length >= 2 ? "pointer" : "default",
                animation: gs.phase === PHASE.MINI_PICK && gs.miniDraw.length >= 2 ? "pulseGlow 2s ease-in-out infinite" : undefined,
              }}>
                {gs.miniDraw.length > 0 && <div style={{ position: "absolute", inset: 4, borderRadius: 8, border: "1.5px solid rgba(255,255,255,0.25)" }} />}
                <span style={{ position: "absolute", bottom: 4, right: 6, fontSize: 10, fontWeight: 700, color: "rgba(255,255,255,0.5)", zIndex: 3 }}>{gs.miniDraw.length}</span>
                {/* Refill animation — card flips open at draw pile then slides to open slot */}
                {gs.miniRefillIdx !== null && (
                  <div style={{
                    position: "absolute", top: 0, left: 0, width: 72, height: 100, borderRadius: 12,
                    zIndex: 10, transformStyle: "preserve-3d",
                    animation: `miniRefillCard${gs.miniRefillIdx} 0.55s ease-in-out forwards`,
                  }}>
                    {/* Card back face */}
                    <div style={{
                      position: "absolute", inset: 0, borderRadius: 12,
                      background: "#1565C0", border: "2px solid #1976D2",
                      backfaceVisibility: "hidden",
                      display: "flex", alignItems: "center", justifyContent: "center",
                    }}>
                      <div style={{ position: "absolute", inset: 4, borderRadius: 8, border: "1.5px solid rgba(255,255,255,0.25)" }} />
                    </div>
                    {/* Card front face — shows the value */}
                    <div style={{
                      position: "absolute", inset: 0, borderRadius: 12,
                      background: (CARD_COLORS[String(gs.miniRefillVal)] || { bg: "#888" }).bg,
                      border: "2px solid rgba(255,255,255,0.15)",
                      backfaceVisibility: "hidden", transform: "rotateY(180deg)",
                      display: "flex", alignItems: "center", justifyContent: "center",
                      fontSize: 28, fontWeight: 900, color: "#fff",
                      fontFamily: "'Arial Rounded MT Bold', sans-serif",
                      textShadow: "0 2px 6px rgba(0,0,0,0.5)",
                    }}>{gs.miniRefillVal}</div>
                  </div>
                )}
              </div>

              {/* 2 open cards — always shown */}
              {gs.miniOpen.map((val, idx) => {
                const isRefilling = gs.miniRefillIdx === idx;
                if (val === null) return (
                  <div key={idx} style={{ width: 72, height: 100, borderRadius: 12, background: "rgba(255,255,255,0.05)", border: "2px dashed rgba(255,255,255,0.15)", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 11, color: "rgba(255,255,255,0.3)" }}>—</div>
                );
                const isHeld = gs.phase === PHASE.MINI_PLACE && gs.miniPickedIdx === idx;
                const canPick = gs.phase === PHASE.MINI_PICK && !isRefilling;
                return (
                  <div key={idx} onClick={canPick ? () => handleMiniPick(idx) : null} style={{
                    width: 72, height: 100, borderRadius: 12,
                    background: isRefilling ? "transparent" : (CARD_COLORS[String(val)] || { bg: "#888" }).bg,
                    border: isHeld ? "3px solid #22C55E" : canPick ? "3px solid #FFB627" : "2px solid rgba(255,255,255,0.15)",
                    display: "flex", alignItems: "center", justifyContent: "center",
                    fontSize: 28, fontWeight: 900, color: "#fff",
                    fontFamily: "'Arial Rounded MT Bold', sans-serif",
                    cursor: canPick ? "pointer" : "default",
                    boxShadow: isHeld ? "0 0 18px rgba(34,197,94,0.6), 0 4px 12px rgba(0,0,0,0.3)" : canPick ? "0 0 14px rgba(255,182,39,0.5), 0 4px 12px rgba(0,0,0,0.3)" : "0 3px 10px rgba(0,0,0,0.3)",
                    textShadow: "0 2px 6px rgba(0,0,0,0.5)",
                    transition: "all 0.3s",
                    animation: isHeld ? "pulseGlow 2s ease-in-out infinite" : canPick ? "pulseGlow 2s ease-in-out infinite" : undefined,
                    opacity: isRefilling ? 0 : isHeld ? 1 : (gs.phase === PHASE.MINI_PLACE && gs.miniPickedIdx !== idx) ? 0.5 : 1,
                  }}>{isRefilling ? "" : val}</div>
                );
              })}
            </div>
          )}

          {/* MINI GAME OVER */}
          {gs.phase === PHASE.MINI_OVER && (
            <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 12 }}>
              <div style={{
                background: "rgba(0,0,0,0.5)", borderRadius: 16, padding: "16px 28px",
                display: "flex", flexDirection: "column", alignItems: "center", gap: 6,
                border: "2px solid #7C3AED", boxShadow: "0 0 20px rgba(124,58,237,0.4)",
              }}>
                <span style={{ fontSize: 14, color: "rgba(233,213,255,0.7)", fontFamily: "'Lilita One', cursive" }}>
                  {gs.miniCleared.length === MINI_GRID_COLS ? "🎉 Perfect Clear!" : `${gs.miniCleared.length}/${MINI_GRID_COLS} Columns Cleared`}
                </span>
                <span style={{ fontSize: 32, fontFamily: "'Lilita One', cursive", color: "#22C55E", textShadow: "0 2px 8px rgba(0,0,0,0.5)" }}>
                  +{gs.miniCoinsEarned} 🪙
                </span>
                {gs.miniCleared.length === MINI_GRID_COLS && (
                  <span style={{ fontSize: 11, color: "#A78BFA" }}>Includes +{MINI_CLEAR_ALL_BONUS} clear bonus + {gs.miniDraw.length * MINI_LEFTOVER_BONUS} leftover bonus</span>
                )}
                <span style={{ fontSize: 12, color: "rgba(255,255,255,0.5)" }}>Balance: {gs.coins} 🪙</span>
              </div>
              <div style={{ display: "flex", gap: 12 }}>
                <button onClick={handleMiniStart} disabled={gs.coins < MINI_ENTRY} style={{
                  background: gs.coins >= MINI_ENTRY ? "linear-gradient(135deg, #7C3AED, #5B21B6)" : "rgba(100,100,100,0.4)",
                  border: "none", borderRadius: 14, padding: "12px 24px",
                  fontSize: 16, fontFamily: "'Lilita One', cursive", color: "#fff",
                  cursor: gs.coins >= MINI_ENTRY ? "pointer" : "default",
                  boxShadow: gs.coins >= MINI_ENTRY ? "0 4px 16px rgba(124,58,237,0.4)" : "none",
                  opacity: gs.coins >= MINI_ENTRY ? 1 : 0.5,
                }}>🔄 Play Again</button>
                <button onClick={handleOpenCity} style={{
                  background: "linear-gradient(135deg, #2E7D32, #1B5E20)", border: "none",
                  borderRadius: 14, padding: "12px 24px",
                  fontSize: 16, fontFamily: "'Lilita One', cursive", color: "#C8E6C9",
                  cursor: "pointer", boxShadow: "0 4px 16px rgba(46,125,50,0.3)",
                }}>🎄 Village</button>
                <button onClick={handleMiniHome} style={{
                  background: "rgba(60,25,5,0.65)", border: "1px solid rgba(255,182,39,0.25)",
                  borderRadius: 14, padding: "12px 24px",
                  fontSize: 16, fontFamily: "'Lilita One', cursive", color: "#FFB627",
                  cursor: "pointer",
                }}>🏠 Home</button>
              </div>
            </div>
          )}
        </div>
      )}
    </div>
  );
}
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(SkyjoGame));
</script>
</body>
</html>
